[workspace]
members = ["core"]

[package]
name = "axe-tabber"
version = "0.1.0"
description = "Turns an audio or video recording into guitar tablature"
authors = ["Dan MacTough"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "axe_tabber_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2.14.1"
tauri-plugin-process = "2.4.0"
dirs = "6"
axe-tabber-core = { path = "core" }
